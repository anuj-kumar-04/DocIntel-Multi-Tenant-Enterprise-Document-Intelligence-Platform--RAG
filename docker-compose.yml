services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docintel-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docintel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docintel_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-docintel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docintel_admin} -d ${POSTGRES_DB:-docintel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docintel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: chrislusf/seaweedfs:latest
    container_name: docintel-minio
    command: server -dir=/data -s3 -s3.port=9000
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-docintel_admin}:${POSTGRES_PASSWORD:-docintel_secure_pass}@db:5432/${POSTGRES_DB:-docintel}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-docintel_admin}:${POSTGRES_PASSWORD:-docintel_secure_pass}@db:5432/${POSTGRES_DB:-docintel}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-docintel-documents}
      - SECRET_KEY=${SECRET_KEY:-dev-docintel-super-secret-key-32-chars-long-minimum-jwt}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-docintel_admin}:${POSTGRES_PASSWORD:-docintel_secure_pass}@db:5432/${POSTGRES_DB:-docintel}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-docintel_admin}:${POSTGRES_PASSWORD:-docintel_secure_pass}@db:5432/${POSTGRES_DB:-docintel}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-docintel-documents}
      - SECRET_KEY=${SECRET_KEY:-dev-docintel-super-secret-key-32-chars-long-minimum-jwt}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    build:
      context: ./infra/prometheus
    container_name: docintel-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    build:
      context: ./infra/grafana
    container_name: docintel-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docintel-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
