services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docintel-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docintel_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-docintel}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docintel_prod} -d ${POSTGRES_DB:-docintel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    restart: always

  redis:
    image: redis:7-alpine
    container_name: docintel-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    restart: always

  minio:
    image: chrislusf/seaweedfs:latest
    container_name: docintel-minio-prod
    command: server -dir=/data -s3 -s3.port=9000
    volumes:
      - minio_data_prod:/data
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-api-prod
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - ENABLE_SWAGGER_IN_PROD=${ENABLE_SWAGGER_IN_PROD:-false}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:?DATABASE_URL_SYNC is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-docintel-documents}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-worker-prod
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:?DATABASE_URL_SYNC is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-docintel-documents}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    container_name: docintel-frontend-prod
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:1.25-alpine
    container_name: docintel-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_DIR:-./infra/nginx/certs}:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
  minio_data_prod:
