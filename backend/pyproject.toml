[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel-backend"
version = "1.0.0"
description = "Multi-Tenant Enterprise Document Intelligence Platform"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "DocIntel Engineering Team" }
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
